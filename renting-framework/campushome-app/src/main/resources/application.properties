spring.application.name=campushome-app
spring.config.import=optional:application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/campushome_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
 
# create-drop while the entity model is still being extended (Housing*
# subclasses on top of core). Switch to "update" once the schema settles,
# so you stop losing data on every restart.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
 

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
 
server.port=8080
server.servlet.context-path=/api